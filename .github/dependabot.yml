version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
    open-pull-requests-limit: 5
    # `chore(deps)` is matched by a commit parser in release-plz.toml and lands under
    # "Dependencies" in the changelog. Any other prefix would fall through to "Other".
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    groups:
      # One pull request for the lot, rather than one per crate. Partial bumps are what leave two
      # versions of the same crate in the graph, and deny.toml sets multiple-versions = "deny",
      # so a drip of individual pull requests would each have to be merged in the right order to
      # stay green. Updating together keeps the graph consistent.
      cargo:
        patterns:
          - "*"

  # No `github-actions` ecosystem, deliberately.
  #
  # .github/workflows/tesmart-cli-release.yml is generated by `dist generate` from
  # dist-workspace.toml, and dist pins the action versions it wants (currently checkout@v6,
  # upload-artifact@v7, download-artifact@v8). Dependabot cannot be scoped to exclude one
  # workflow file, so it rewrites those pins, and the `dist` job in ci.yml then fails because
  # the checked-in file no longer matches what dist would produce. Regenerating reverts
  # dependabot, dependabot re-raises it, and the two never converge.
  #
  # Little is lost. Our own workflows pin moving major tags, so patch and security fixes arrive
  # without a pull request, and a major bump is worth reading the changelog for anyway.
