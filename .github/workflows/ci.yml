name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  # Called by release-plz.yml. A release pull request is merged with the default GITHUB_TOKEN,
  # which cannot trigger workflow runs, so the release job has to run this suite itself.
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo clippy --workspace --all-targets --no-default-features
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [all-features, no-default-features, default]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: |
          case "${{ matrix.features }}" in
            all-features)        cargo test --workspace --all-features ;;
            no-default-features) cargo test --workspace --no-default-features ;;
            default)             cargo test --workspace ;;
          esac

  # One transport at a time. Every row is spelled `--no-default-features --features X`, because
  # `--features X` alone leaves the default `tcp` on, which would mean the single-transport
  # builds were never actually built.
  #
  # The facade is re-exports only, so these rows check that each transport's `pub use` resolves
  # on its own, and that the crate is still coherent with no transport at all.
  facade:
    name: tesmart (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - "--no-default-features"
          - "--no-default-features --features tcp"
          - "--no-default-features --features serial"
          - "--no-default-features --features sim"
          - "--all-features"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p tesmart --all-targets ${{ matrix.features }}
      - run: cargo test -p tesmart ${{ matrix.features }}

  # There is deliberately no matrix for `tesmart-cli`: it has no features, so every build of it
  # is the same build, already covered by the workspace jobs above.
  #
  # Note that those workspace jobs never build the facade with no transport, because the tool
  # asks for `tcp`, `serial` and `sim` explicitly and feature unification applies that to the
  # whole graph. The matrix above is the only place the trimmed facade is compiled at all.

  # release-plz does the publishing, in dependency order, when a release PR merges. This job is
  # the pre-flight: it catches the traps on the pull request that introduces them rather than
  # halfway through a release, when some crates are already on the registry and cannot be taken
  # back. Metadata crates.io rejects, a missing file, a dev-dependency that deadlocks.
  #
  # Only `tesmart-proto` can be packaged for real before the first release: `cargo package`
  # resolves regular dependencies against the registry even with `--no-verify`, so every crate
  # above the graph root fails with "no matching package" until the one below it is published.
  # `--list` does the manifest rewrite without resolving, which is the part worth checking.
  package:
    name: cargo package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: the graph root packages for real
        run: cargo package -p tesmart-proto --allow-dirty
      - name: every crate produces a valid package listing
        run: |
          for crate in tesmart-device tesmart-client tesmart-tcp tesmart-serial tesmart-sim tesmart tesmart-cli; do
            echo "::group::$crate"
            cargo package -p "$crate" --list --allow-dirty
            echo "::endgroup::"
          done
      - name: the cyclic dev-dependency carries no version
        # tesmart-sim depends on tesmart-client, so a versioned dev-dependency would have to be
        # published before the crate it depends on. Cargo drops a version-less one instead.
        run: |
          for crate in tesmart-client tesmart-tcp tesmart-serial; do
            if grep -E '^tesmart-sim *= *\{[^}]*version' "crates/$crate/Cargo.toml"; then
              echo "::error::crates/$crate declares tesmart-sim with a version; publishing will deadlock"
              exit 1
            fi
          done

  # Both halves of the protocol claim to be sans-IO and allocation free. A bare-metal target
  # with no `std` at all is the only honest way to check that claim.
  #
  # The `tesmart-device` build is load-bearing, not decorative: the whole reason the switch side
  # is its own crate rather than a feature of `tesmart-proto` is that it can run as firmware.
  # If this step is ever dropped, that claim quietly stops being true.
  no-std:
    name: no_std build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2
      - name: the controller side
        run: cargo build -p tesmart-proto --target thumbv7em-none-eabi
      - name: the controller side, with serde
        run: cargo build -p tesmart-proto --features serde --target thumbv7em-none-eabi
      - name: the switch side
        run: cargo build -p tesmart-device --target thumbv7em-none-eabi

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: read rust-version from the workspace manifest
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --all-targets

  # The decoder is the component most exposed to malformed input, so it gets a longer run of the
  # property tests than the default 256 cases.
  proptest:
    name: extended property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p tesmart-proto --all-features --test decoder
        env:
          PROPTEST_CASES: "8192"
      # Engine against device: the test that would catch an inverted ±1, a length byte computed
      # from the wrong end, or a retry budget that cannot survive a dropped reply.
      - run: cargo test -p tesmart-device --test roundtrip
        env:
          PROPTEST_CASES: "8192"
