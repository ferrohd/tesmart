name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# Supersede running jobs on a pull request, but never on master: master runs are what populate
# the cache every pull request restores from, and a cancelled one also leaves the branch's status
# ambiguous.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job is the same four steps against a different recipe in the justfile, which is also what
# a developer runs locally:
#
#   nix develop .#ci --command just <recipe>
#
# The toolchain, its targets and every tool come from flake.nix, pinned by flake.lock, so there
# is no `with: toolchain:` or install-action anywhere to drift from what is used locally.
# `just all` runs the whole set in one go.
#
# All of it runs on ubuntu-latest. The two platforms we ship binaries for but cannot run tests on
# are reached by `cargo check --target` in the `targets` job, and dist's own generated workflow
# builds and links all three on native runners for every pull request.

jobs:
  checks:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: fmt, recipe: fmt }
          - { name: clippy, recipe: clippy }
          - { name: doc, recipe: doc }
          - { name: "test (all features)", recipe: test, args: --all-features }
          - { name: "test (default features)", recipe: test }
          - { name: "test (no default features)", recipe: test, args: --no-default-features }
          - { name: feature combinations, recipe: features }
          # Bare-metal builds, plus cross-checks for the shipped platforms we never run.
          - { name: other targets, recipe: targets }
          - { name: extended property tests, recipe: proptest }
          - { name: publish preflight, recipe: publish }
          - { name: supply chain, recipe: deny }
          - { name: toml formatting, recipe: toml }
          - { name: spelling, recipe: typos }
          - { name: release packaging plan, recipe: dist }
          - { name: workflow lint, recipe: workflows }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@main

      # Swatinem/rust-cache shells out to rustc to build its cache key, and the toolchain only
      # exists inside the dev shell, so it needs to be reachable from the job too.
      - name: Put the pinned toolchain on PATH
        run: nix develop .#ci --command bash -c 'command -v cargo | xargs dirname' >> "$GITHUB_PATH"

      - uses: Swatinem/rust-cache@v2
        with:
          # One cache per job, and only master writes, so pull requests cannot evict each other.
          shared-key: ${{ matrix.recipe }}${{ matrix.args }}
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - run: nix develop .#ci --command just ${{ matrix.recipe }} ${{ matrix.args }}

  # Separate because it is the one job that does not use the pinned stable toolchain: the shell
  # provides a compiler matching Cargo.toml's rust-version instead.
  #
  # This used to be a stable toolchain with RUSTUP_TOOLCHAIN pointed at 1.88 and a step asserting
  # the override had taken effect, because rust-toolchain.toml's channel silently won otherwise.
  # There is no rustup shim here, so the toolchain is simply the one the shell contains.
  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: DeterminateSystems/nix-installer-action@main
      - name: Put the MSRV toolchain on PATH
        run: nix develop .#msrv --command bash -c 'command -v cargo | xargs dirname' >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - run: nix develop .#msrv --command just msrv

  pr-title:
    name: pull request title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      # Squash merge makes the pull request title the commit message on master, and
      # release-plz.toml derives the changelog from these prefixes. An unrecognised one would
      # land the change under "Other" instead of failing, so it is checked here.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            ci
            build
            chore
            style
            revert
          requireScope: false
