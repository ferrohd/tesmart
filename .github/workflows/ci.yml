name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy + docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features
      - run: cargo clippy --workspace --all-targets --no-default-features
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: [all-features, no-default-features, default]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: |
          case "${{ matrix.features }}" in
            all-features)        cargo test --workspace --all-features ;;
            no-default-features) cargo test --workspace --no-default-features ;;
            default)             cargo test --workspace ;;
          esac

  # One transport at a time, because the facade's target resolution and `AnyConnector` change
  # shape with each: a variant that only compiles when its neighbour is enabled would not be
  # caught by `--all-features` alone.
  facade:
    name: tesmart (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["--no-default-features", "", "--features serial", "--features sim", "--all-features"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p tesmart --all-targets ${{ matrix.features }}
      - run: cargo test -p tesmart ${{ matrix.features }}

  # Both halves of the protocol claim to be sans-IO and allocation free. A bare-metal target
  # with no `std` at all is the only honest way to check that claim.
  #
  # The `tesmart-device` build is load-bearing, not decorative: the whole reason the switch side
  # is its own crate rather than a feature of `tesmart-proto` is that it can run as firmware.
  # If this step is ever dropped, that claim quietly stops being true.
  no-std:
    name: no_std build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2
      - name: the controller side
        run: cargo build -p tesmart-proto --target thumbv7em-none-eabi
      - name: the controller side, with serde
        run: cargo build -p tesmart-proto --features serde --target thumbv7em-none-eabi
      - name: the switch side
        run: cargo build -p tesmart-device --target thumbv7em-none-eabi

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: read rust-version from the workspace manifest
        id: msrv
        run: echo "version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-features --all-targets

  # The decoder is the component most exposed to malformed input, so it gets a longer run of the
  # property tests than the default 256 cases.
  proptest:
    name: extended property tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p tesmart-proto --all-features --test decoder
        env:
          PROPTEST_CASES: "8192"
      # Engine against device: the test that would catch an inverted ±1, a length byte computed
      # from the wrong end, or a retry budget that cannot survive a dropped reply.
      - run: cargo test -p tesmart-device --test roundtrip
        env:
          PROPTEST_CASES: "8192"
