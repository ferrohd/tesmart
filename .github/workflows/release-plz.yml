name: Release-plz

on:
  push:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Publish the packages whose version is not on the registry yet, in dependency order, then tag
  # and create the GitHub releases. With `release_always = false` this only acts on commits that
  # came from merging a release pull request.
  #
  # There is deliberately no `needs: checks` here. That gate exists in projects where release-plz
  # runs with the default GITHUB_TOKEN, which cannot trigger workflows and therefore starves the
  # release pull request of CI, leaving the release job as the only place checks could run. We use
  # a PAT, so the release pull request is checked by ci.yml like any other, before the merge that
  # reaches this job.
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.repository_owner == 'ferrohd' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so release-plz can see what changed since the last release.
          fetch-depth: 0
          # The token is given to the release-plz step alone rather than left in the git config.
          # It would only be needed here if we signed tags or ran `git push` ourselves.
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@main

      # release-plz shells out to `cargo publish`, so it needs a toolchain on PATH. Taking the
      # pinned one from the flake means releases are built with the same compiler CI checked
      # with, rather than whatever stable happens to be on the day.
      - name: Put the pinned toolchain on PATH
        run: nix develop .#ci --command bash -c 'command -v cargo | xargs dirname' >> "$GITHUB_PATH"

      - name: Release
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          # A PAT, not the default GITHUB_TOKEN. Releasing creates tags, and a tag pushed by the
          # default token does not trigger workflows, so tesmart-cli--release.yml would never run
          # and the draft release would sit empty forever.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Open or update the release pull request carrying the version bumps and changelogs.
  release-pr:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.repository_owner == 'ferrohd' }}
    permissions:
      contents: write
      pull-requests: write
    # Serialise runs so two pushes cannot race on the same release pull request. Deliberately no
    # cancel-in-progress, which would drop a pending run rather than queue it.
    concurrency:
      group: release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: DeterminateSystems/nix-installer-action@main

      # release-plz shells out to `cargo publish`, so it needs a toolchain on PATH. Taking the
      # pinned one from the flake means releases are built with the same compiler CI checked
      # with, rather than whatever stable happens to be on the day.
      - name: Put the pinned toolchain on PATH
        run: nix develop .#ci --command bash -c 'command -v cargo | xargs dirname' >> "$GITHUB_PATH"

      - name: Release PR
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          # The PAT is what lets ci.yml run on the release pull request it opens.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
