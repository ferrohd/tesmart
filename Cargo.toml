[workspace]
resolver = "3"
members = [
  "crates/tesmart-client",
  "crates/tesmart-device",
  "crates/tesmart-proto",
  "crates/tesmart-sim",
  "crates/tesmart-tcp",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "AGPL-3.0-or-later"
repository = "https://github.com/ferrohd/tesmart"

[workspace.dependencies]
# Workspace crates.
#
# Each carries a version as well as a path, which is what `cargo publish` requires. The one
# exception is the *dev*-dependency on tesmart-sim in tesmart-client, tesmart-tcp and
# tesmart-serial: tesmart-sim depends on tesmart-client, so a versioned dev-dependency would
# make the first publish of either impossible. Those three declare it by path alone, which
# cargo drops from the published manifest. See their own manifests.
tesmart-proto = { path = "crates/tesmart-proto", version = "0.1.0" }
tesmart-device = { path = "crates/tesmart-device", version = "0.1.0" }
tesmart-client = { path = "crates/tesmart-client", version = "0.1.0" }
tesmart-sim = { path = "crates/tesmart-sim", version = "0.1.0" }
tesmart-tcp = { path = "crates/tesmart-tcp", version = "0.1.0" }

# Core
thiserror = { version = "2.0.21", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
tokio = { version = "1.53.3", default-features = false }
tracing = { version = "0.1.44", default-features = false, features = ["std", "attributes"] }
humantime = "2.4.0"

# Dev
proptest = "1.12.0"
tracing-subscriber = { version = "0.3.23", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
