[package]
name = "tesmart-cli"
description = "Command line tool for TESmart KVM switches and HDMI matrices, over TCP or RS232"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["tesmart", "kvm", "cli", "rs232"]
categories = ["command-line-utilities"]

[[bin]]
name = "tesmart"
path = "src/main.rs"
# The binary is named `tesmart` and so is the library crate, which makes `cargo doc` write both
# to target/doc/tesmart (rust-lang/cargo#6313). The library is the published artifact, so the
# binary yields: its internal docs are a developer convenience, not an interface.
doc = false

# No features. Cargo features let a dependency's consumers avoid paying for what they do not
# use, and a binary has no consumers: whoever runs `cargo install tesmart-cli` wants a tool that
# can reach a switch however the switch is wired. RS232 is not an extra here — every TESmart
# document is titled "LAN & RS232 Control Protocols" — and the emulator is how the thing is
# usable without hardware. The facade keeps its transport features, because it really is a
# dependency.

[dependencies]
# One dependency, which is also how a library consumer sees the project. Everything the tool
# needs comes through the facade's re-exports, so a gap in them shows up here first.
tesmart = { workspace = true, features = ["tcp", "serial", "sim"] }

# A current-thread runtime is plenty: the tool runs one conversation at a time.
tokio = { workspace = true, features = ["rt", "macros", "time", "signal"] }
clap = { workspace = true }
clap_complete = { workspace = true }
clap_mangen = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "ansi"] }
anstream = { workspace = true }
owo-colors = { workspace = true }
humantime = { workspace = true }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
assert_cmd = { workspace = true }
insta = { workspace = true }
predicates = { workspace = true }

[lints]
workspace = true
