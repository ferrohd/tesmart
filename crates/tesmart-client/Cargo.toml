[package]
name = "tesmart-client"
description = "Async driver and operations for TESmart KVM switches and HDMI matrices, over any byte stream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["tesmart", "kvm", "tokio", "async"]
categories = ["network-programming", "asynchronous"]

[dependencies]
tesmart-proto = { workspace = true }
# `macros` is for `tokio::select!` in the driver loop. Still no `net` and no `rt`: this crate
# opens nothing and spawns nothing.
tokio = { workspace = true, features = ["io-util", "time", "macros"] }
tracing = { workspace = true }
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
# Cyclic dev-dependency: tesmart-sim depends on this crate for `Connector`. Declared by path
# with **no version on purpose** — cargo drops a version-less dev-dependency when packaging,
# which is the only way either crate can be published a first time. The published .crate
# therefore cannot run its own tests, which is normal and expected.
tesmart-sim = { path = "../tesmart-sim" }
tokio = { workspace = true, features = ["io-util", "time", "rt", "macros", "test-util"] }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter"] }

[lints]
workspace = true
