[package]
name = "tesmart-proto"
description = "Sans-IO TESmart KVM and HDMI matrix control protocols: the controller side"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["tesmart", "kvm", "protocol", "sans-io", "no-std"]
categories = ["no-std", "network-programming", "parser-implementations"]

# No default features, deliberately: this crate's reason to exist is being usable on a
# microcontroller, so a bare dependency gets the protocol and nothing else.
#
# The switch side of the protocol is `tesmart-device`, a separate crate rather than a feature
# here: everyone needs the controller, almost nobody needs the device, and a feature that gates
# a thousand lines of self-contained code is a crate boundary wearing a disguise.
[features]
# `serde` derives on the small value types (ports, families, capabilities).
serde = ["dep:serde"]

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true, optional = true }

[lints]
workspace = true
