[package]
name = "tesmart"
description = "Control TESmart KVM switches and HDMI matrices over TCP or RS232"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["tesmart", "kvm", "matrix", "rs232", "hdmi"]
categories = ["network-programming", "asynchronous", "hardware-support"]

[lib]
# The crate-level example connects, which needs a transport feature, and this crate is also
# built with none. Rather than gate the one example a reader wants to see, the compiled
# examples live in the crates it re-exports: `tesmart-tcp` and `tesmart-client` doctest their
# own, under every feature combination.
doctest = false

[features]
# TCP is the transport almost everyone wants: every switch ships with its LAN port on
# 192.168.1.10:5000.
default = ["tcp"]
# The switch's LAN port.
tcp = ["dep:tesmart-tcp"]
# The switch's RS232 port. Off by default because a TCP-only caller should not pay for it;
# there is no system library to install either way.
serial = ["dep:tesmart-serial"]
# An emulated switch, for tests and for trying things without hardware.
sim = ["dep:tesmart-sim"]
# `serde` derives on the protocol value types.
serde = ["tesmart-proto/serde"]

[dependencies]
tesmart-proto = { workspace = true }
tesmart-client = { workspace = true }
tesmart-tcp = { workspace = true, optional = true }
tesmart-serial = { workspace = true, optional = true }
tesmart-sim = { workspace = true, optional = true }

# Every transport, so all of the re-exports are documented.
[package.metadata.docs.rs]
all-features = true

[lints]
workspace = true
