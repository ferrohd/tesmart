[workspace]
members = ["cargo:."]

# Config for 'dist'. Only `tesmart-cli` produces a binary, so it is the only package dist
# considers an app; the seven libraries are skipped automatically for having no binaries.
#
# The generated workflow is .github/workflows/tesmart-cli-release.yml, which is checked in and
# verified by the `dist` job in ci.yml. Edit this file and re-run `dist generate`, never the
# workflow directly.
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax).
#
# Must match whatever runs `dist generate --check`, which is now the `cargo-dist` in the pinned
# nixpkgs. Upgrades therefore arrive by bumping flake.lock, in one place. Getting this wrong is
# not subtle: the check fails with "you're running X but Y is set".
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax).
#
# Every one of these builds on a native runner: ubuntu-22.04, macos-14 and windows-2022.
#
# aarch64-unknown-linux-gnu is absent because it needs a cross linker and sysroot, and
# `serialport` is platform FFI, so it is not something to discover is broken during a release.
# x86_64-apple-darwin is absent because Intel Macs no longer justify a second macOS runner, and
# this workspace has no target_arch conditionals at all, so aarch64-apple-darwin exercises every
# darwin-specific code path there is.
targets = ["x86_64-unknown-linux-gnu", "aarch64-apple-darwin", "x86_64-pc-windows-msvc"]

# release-plz owns the GitHub release: it publishes the crates, pushes the tag and creates the
# release as a draft with the changelog as its body. dist then uploads the binaries into that
# draft and undrafts it once they are all there. Without this both tools would try to create the
# same release.
create-release = false

# Restricts the workflow's tag trigger to 'tesmart-cli**[0-9]+.[0-9]+.[0-9]+*'. release-plz tags
# every published crate as <package>-v<version>, so without a namespace all eight tags would
# start this workflow and the seven library ones would mint empty, build-less releases.
tag-namespace = "tesmart-cli"

# Build all three targets on every pull request, on native runners, with real linking.
#
# This is the only cross-platform coverage that links. Our own CI is Linux-only and reaches the
# other two with `cargo check --target`, which catches type errors but never runs the linker, so
# a missing import-lib symbol on Windows would otherwise surface during a release — after the
# crates.io publish, which cannot be undone. Three extra runners per PR buys that away.
#
# It also exercises `--profile dist`, which is where the tesmart-device opt-level 3 compile bomb
# lived, so that regression cannot come back unnoticed.
pr-run-mode = "upload"
