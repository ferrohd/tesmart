[workspace]
# Publish only when the release PR is merged, not on every commit to master.
release_always = false

# Pin the tag template. The default switches to "v{{ version }}" whenever the workspace has a
# single publishable package, so pinning keeps tag names stable regardless of how many crates
# are published.
#
# Per-package tags are not optional here: all eight crates are published, and eight releases
# cannot share one tag. dist's trigger is narrowed to the tesmart-cli tag via `tag-namespace` in
# dist-workspace.toml so the seven library tags do not start the binary build.
git_tag_name = "{{ package }}-v{{ version }}"

# `cargo publish` verifies by building with default features only. That would leave `serial` and
# `sim` unverified at the moment they ship, and they are the features most likely to break: one
# pulls in a system serial port, the other is the whole switch-side emulator.
publish_all_features = true

pr_labels = ["release"]

# tesmart-cli is the only crate that ships a binary, so its release is the one dist fills in.
# Creating it as a draft is the handoff: dist uploads the archives and installers into it and
# undrafts it once they are all present, which pairs with `create-release = false` on dist's
# side. The seven library releases are published immediately, since nothing is pending for them.
[[package]]
name = "tesmart-cli"
git_release_draft = true

[changelog]
# Never drop a breaking change, even when its type matches a skip rule below.
protect_breaking_commits = true

# Ordered: first match wins. Mirrors the conventional-commit prefixes actually used in this
# repository, which so far are feat, test, docs, build, chore and ci.
commit_parsers = [
    { message = '^feat', group = "Added" },
    { message = '^fix', group = "Fixed" },
    { message = '^perf', group = "Performance" },
    { message = '^refactor', group = "Changed" },
    { message = '^docs', group = "Documentation" },
    # Dependency bumps are worth listing even though their prefixes are skipped below.
    { message = '^(chore|build)\(deps\)', group = "Dependencies" },
    { message = '^(ci|style|test|chore|build)', skip = true },
    { message = '^.*', group = "Other" },
]
